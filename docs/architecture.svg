<svg width="100%" viewBox="0 0 680 810" role="img" aria-label="Pharos Weather Market architecture: cross-chain USDC onboarding via Arc Bridge Kit and CCTP, bet placement, a lock step that forks into two independent oracle paths (owner-submitted or Chainlink CCIP) which converge on the same guarded submitResult call, and proportional claim payout." xmlns="http://www.w3.org/2000/svg">
<title>Pharos Weather Market — Architecture</title>
<desc>Four-phase diagram. Cross-chain onboarding: Arc Network USDC moves to Pharos Mainnet as Circle-native USDC via Arc Bridge Kit + CCTP burn-attest-mint, no wrapped asset. Place Bet: User calls WeatherMarket.placeBet, which pulls USDC via transferFrom. Lock and Settle: lockMarket is callable by anyone once lockTime passes, moving status OPEN to LOCKED; settlement then forks into two independent paths — AdminOracle.submitResult (Phase 1, manual, onlyOwner) or CCIPWeatherOracle.submitResult (Phase 2, automated, driven by Chainlink CCIP messages from Ethereum, Base, Polygon or Jovay) — both of which call the same onlyOracle-gated WeatherMarket.submitResult, which requires LOCKED and sets SETTLED. Claim Winnings: claimWinnings pays out userBet times netPool divided by bucketTotal, with a 2% fee that is waived in full and replaced by a full refund when no bet lands on the winning bucket.</desc>
<defs>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-rust" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#0369A1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ============ SECTION 1: CROSS-CHAIN ONBOARDING ============ -->
<text x="40" y="28" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" letter-spacing="0.08em" fill="#52514E" opacity="0.6">CROSS-CHAIN ONBOARDING</text>
<line x1="40" y1="34" x2="640" y2="34" stroke="#0B0B0B" stroke-width="0.5" opacity="0.1"/>

<rect x="40" y="46" width="200" height="74" rx="12" fill="#F1F5F9" stroke="#475569" stroke-width="0.5"/>
<text x="140" y="72" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#334155">Arc Network</text>
<text x="140" y="92" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#475569" opacity="0.8">USDC (source chain)</text>

<line x1="242" y1="83" x2="396" y2="83" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
<text x="319" y="68" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#0F6E56">Arc Bridge Kit + CCTP</text>
<text x="319" y="101" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#0F6E56" opacity="0.75">burn → attest → mint</text>

<rect x="400" y="46" width="240" height="74" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="520" y="72" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#085041">Pharos Mainnet (1672)</text>
<text x="520" y="92" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0F6E56" opacity="0.8">Circle-native USDC, no wrapping</text>

<!-- ============ SECTION 2: PLACE BET ============ -->
<text x="40" y="158" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" letter-spacing="0.08em" fill="#52514E" opacity="0.6">PLACE BET</text>
<line x1="40" y1="164" x2="640" y2="164" stroke="#0B0B0B" stroke-width="0.5" opacity="0.1"/>

<rect x="40" y="176" width="160" height="60" rx="12" fill="#F4F4F5" stroke="#A1A1AA" stroke-width="0.5"/>
<text x="120" y="206" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#3F3F46">User</text>

<line x1="202" y1="206" x2="396" y2="213" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
<text x="300" y="196" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#0F6E56" opacity="0.7">placeBet()</text>

<rect x="400" y="176" width="240" height="74" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="520" y="200" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#085041">WeatherMarket.sol</text>
<text x="520" y="218" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#0F6E56" opacity="0.8">placeBet(marketId, bucket, amount)</text>
<rect x="420" y="230" width="200" height="16" rx="4" fill="#0F6E56" opacity="0.12"/>
<text x="520" y="238" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#0F6E56">usdc.transferFrom(sender → market)</text>

<!-- ============ SECTION 3: LOCK & SETTLE — TWO ORACLE PATHS ============ -->
<text x="40" y="288" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" letter-spacing="0.08em" fill="#52514E" opacity="0.6">LOCK &amp; SETTLE — TWO INDEPENDENT ORACLE PATHS</text>
<line x1="40" y1="294" x2="640" y2="294" stroke="#0B0B0B" stroke-width="0.5" opacity="0.1"/>

<line x1="340" y1="250" x2="340" y2="305" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-slate)" opacity="0.6"/>

<rect x="40" y="306" width="600" height="54" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="326" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#633806">lockMarket(marketId)</text>
<text x="340" y="344" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#854F0B" opacity="0.85">callable by anyone once lockTime passes — status OPEN → LOCKED</text>

<line x1="190" y1="360" x2="190" y2="390" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
<line x1="490" y1="360" x2="490" y2="390" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

<rect x="40" y="392" width="280" height="100" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="180" y="406" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" letter-spacing="0.06em" fill="#993C1D" opacity="0.6">PHASE 1 · MANUAL</text>
<text x="180" y="424" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#712B13">AdminOracle</text>
<text x="180" y="442" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#993C1D" opacity="0.85">.submitResult(city, temp, id)</text>
<rect x="60" y="454" width="240" height="24" rx="6" fill="#993C1D" opacity="0.12"/>
<text x="180" y="466" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#993C1D">onlyOwner</text>

<rect x="360" y="392" width="280" height="100" rx="12" fill="#E0F2FE" stroke="#0369A1" stroke-width="0.5"/>
<text x="500" y="406" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" letter-spacing="0.06em" fill="#0369A1" opacity="0.6">PHASE 2 · AUTOMATED</text>
<text x="500" y="424" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#0C4A6E">CCIPWeatherOracle</text>
<text x="500" y="442" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0369A1" opacity="0.85">.submitResult(marketId, finalTemp)</text>
<rect x="380" y="454" width="240" height="24" rx="6" fill="#0369A1" opacity="0.12"/>
<text x="500" y="466" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#0369A1">Chainlink CCIP · ETH / Base / Polygon / Jovay</text>

<line x1="180" y1="492" x2="180" y2="520" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow-rust)"/>
<line x1="500" y1="492" x2="500" y2="520" stroke="#0369A1" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

<rect x="40" y="522" width="600" height="60" rx="12" fill="#F1F5F9" stroke="#475569" stroke-width="0.5"/>
<text x="340" y="544" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="500" fill="#1E293B">WeatherMarket.submitResult(marketId, finalTemp)</text>
<text x="340" y="562" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#475569" opacity="0.85">onlyOracle-gated · requires status == LOCKED · sets status = SETTLED</text>

<!-- ============ SECTION 4: CLAIM WINNINGS ============ -->
<line x1="340" y1="582" x2="340" y2="637" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-slate)" opacity="0.6"/>

<text x="40" y="620" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" letter-spacing="0.08em" fill="#52514E" opacity="0.6">CLAIM WINNINGS</text>
<line x1="40" y1="626" x2="640" y2="626" stroke="#0B0B0B" stroke-width="0.5" opacity="0.1"/>

<rect x="40" y="638" width="600" height="100" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="340" y="660" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#27500A">claimWinnings(marketId)</text>
<rect x="60" y="674" width="248" height="28" rx="6" fill="#3B6D11" opacity="0.12"/>
<text x="184" y="688" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#3B6D11">payout = userBet × netPool / bucketTotal</text>
<rect x="332" y="674" width="288" height="28" rx="6" fill="#3B6D11" opacity="0.12"/>
<text x="476" y="688" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#3B6D11">FEE_BPS = 200 (2%), waived if noWinner</text>
<text x="340" y="718" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#3B6D11" opacity="0.8">noWinner ⇒ full refund of userTotalBets, no fee taken</text>

